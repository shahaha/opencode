version: "3.8"

services:
  # 前端應用 - 替代端口
  opencode-frontend:
    build:
      context: ./packages/console/app
      dockerfile: Dockerfile
    container_name: opencode-frontend-lan-alt
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      - VITE_OPENCODE_API_URL=http://localhost:3001
      - VITE_OPENCODE_WS_URL=ws://localhost:3001
      - HOST=0.0.0.0
    networks:
      - opencode-lan-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - opencode-backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # 後端 API - 替代端口
  opencode-backend:
    build:
      context: ./packages/opencode
      dockerfile: Dockerfile
    container_name: opencode-backend-lan-alt
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=3000
      - DATABASE_URL=postgresql://opencode:${POSTGRES_PASSWORD}@postgres:5432/opencode
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET}
      - SENTRY_DSN=${SENTRY_DSN}
    networks:
      - opencode-lan-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "healthcheck.js"]
      interval: 30s
      timeout: 10s
      retries: 3

  # 資料庫
  postgres:
    image: postgres:15-alpine
    container_name: opencode-postgres-lan-alt
    restart: unless-stopped
    environment:
      - POSTGRES_DB=opencode
      - POSTGRES_USER=opencode
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres_lan_alt_data:/var/lib/postgresql/data
    networks:
      - opencode-lan-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opencode -d opencode"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis
  redis:
    image: redis:7-alpine
    container_name: opencode-redis-lan-alt
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_lan_alt_data:/data
    networks:
      - opencode-lan-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

networks:
  opencode-lan-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/16 # 不同的網路段

volumes:
  postgres_lan_alt_data:
  redis_lan_alt_data:
