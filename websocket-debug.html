<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WebSocket Debug Test</title>
    <style>
      body {
        font-family: monospace;
        margin: 20px;
      }
      .log {
        margin: 5px 0;
        padding: 5px;
        border-left: 3px solid #ccc;
      }
      .success {
        border-color: #4caf50;
        background-color: #f8fff8;
      }
      .error {
        border-color: #f44336;
        background-color: #fff8f8;
      }
      .info {
        border-color: #2196f3;
        background-color: #f8f8ff;
      }
      button {
        padding: 10px 20px;
        margin: 5px;
      }
      input {
        padding: 8px;
        width: 300px;
      }
    </style>
  </head>
  <body>
    <h1>WebSocket Debug Test</h1>
    <p>Testing connection to: <code>ws://192.168.0.221:4000/ag-ui/ws</code></p>

    <div>
      <button onclick="connect()">Connect</button>
      <button onclick="disconnect()">Disconnect</button>
      <button onclick="clearLog()">Clear Log</button>
    </div>

    <div>
      <input type="text" id="messageInput" placeholder="Enter message" value="hello" />
      <button onclick="sendMessage()">Send Message</button>
    </div>

    <div>
      <h3>Connection Status: <span id="status">Disconnected</span></h3>
      <h3>Log:</h3>
      <div id="log"></div>
    </div>

    <script>
      let ws = null

      function log(message, type = "info") {
        const logDiv = document.getElementById("log")
        const timestamp = new Date().toLocaleTimeString()
        logDiv.innerHTML += `<div class="log ${type}">[${timestamp}] ${message}</div>`
        logDiv.scrollTop = logDiv.scrollHeight
        console.log(`[${timestamp}] ${message}`)
      }

      function updateStatus(status) {
        document.getElementById("status").textContent = status
      }

      function connect() {
        if (ws && ws.readyState === WebSocket.OPEN) {
          log("Already connected", "info")
          return
        }

        log("Connecting to WebSocket...", "info")
        updateStatus("Connecting...")

        ws = new WebSocket("ws://192.168.0.221:4000/ag-ui/ws")

        ws.onopen = function (event) {
          log("WebSocket connected successfully!", "success")
          updateStatus("Connected")

          // Send authentication
          const authMessage = {
            jsonrpc: "2.0",
            id: 1,
            method: "authenticate",
            params: {
              sessionId: "test-session",
              token: "dev-token-123",
            },
          }

          log("Sending authentication...", "info")
          ws.send(JSON.stringify(authMessage))
        }

        ws.onmessage = function (event) {
          try {
            const data = JSON.parse(event.data)
            log(`Received: ${JSON.stringify(data, null, 2)}`, "info")

            if (data.result && data.result.authenticated) {
              log("Authentication successful!", "success")
            } else if (data.type === "agent.message") {
              log(`AI Response: ${data.data?.content || data.content}`, "success")
            } else if (data.type === "agent.thinking") {
              log("AI is thinking...", "info")
            }
          } catch (e) {
            log(`Received raw: ${event.data}`, "info")
          }
        }

        ws.onclose = function (event) {
          log(`WebSocket closed (code: ${event.code}, reason: ${event.reason})`, "error")
          updateStatus("Disconnected")
        }

        ws.onerror = function (error) {
          log(`WebSocket error: ${error}`, "error")
          updateStatus("Error")
        }
      }

      function disconnect() {
        if (ws) {
          log("Disconnecting...", "info")
          ws.close()
          ws = null
        } else {
          log("Not connected", "info")
        }
      }

      function sendMessage() {
        if (!ws || ws.readyState !== WebSocket.OPEN) {
          log("Not connected to WebSocket", "error")
          return
        }

        const message = document.getElementById("messageInput").value
        const messageData = {
          jsonrpc: "2.0",
          id: Date.now(),
          method: "agent.message",
          params: {
            content: message,
            sessionId: "test-session",
          },
        }

        log(`Sending message: ${message}`, "info")
        ws.send(JSON.stringify(messageData))
      }

      function clearLog() {
        document.getElementById("log").innerHTML = ""
      }

      // Auto-connect on page load
      window.onload = function () {
        log('Page loaded. Click "Connect" to test WebSocket connection.', "info")
      }
    </script>
  </body>
</html>
