name: Tests

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: |
          cd packages/opencode
          bun install

      - name: Type check
        run: |
          cd packages/opencode
          bun run typecheck

      - name: Run unit tests
        run: |
          cd packages/opencode
          bun test --coverage

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.lcov
          fail_ci_if_error: false

  a2a-integration-tests:
    name: A2A Integration Tests
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: |
          cd packages/opencode
          bun install

      - name: Start test server
        run: |
          cd packages/opencode
          bun run --conditions=browser ./src/index.ts serve --hostname 0.0.0.0 --port 5000 &
          SERVER_PID=$!
          echo "SERVER_PID=$SERVER_PID" >> $GITHUB_ENV
          sleep 10

      - name: Run A2A tests
        run: |
          cd packages/opencode
          bun test test/server/a2a.test.ts

      - name: Run MCP tests
        run: |
          cd packages/opencode
          bun test test/server/mcp-integration.test.ts

      - name: Cleanup
        if: always()
        run: kill $SERVER_PID 2>/dev/null || true

  delegation-tests:
    name: Delegation Flow Tests
    runs-on: ubuntu-latest
    needs: a2a-integration-tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: |
          cd packages/opencode
          bun install

      - name: Start main server
        run: |
          cd packages/opencode
          bun run --conditions=browser ./src/index.ts serve --hostname 0.0.0.0 --port 5000 &
          MAIN_PID=$!
          echo "MAIN_PID=$MAIN_PID" >> $GITHUB_ENV
          sleep 10

      - name: Start external agent server
        run: |
          cd packages/opencode
          bun run --conditions=browser ./src/index.ts serve --hostname 0.0.0.0 --port 5001 &
          EXT_PID=$!
          echo "EXT_PID=$EXT_PID" >> $GITHUB_ENV
          sleep 10

      - name: Run delegation tests
        run: |
          # Create agent and capture the agent ID
          AGENT_RESPONSE=$(curl -s -X POST http://localhost:5000/a2a/agents \
            -H "Content-Type: application/json" \
            -d '{"name":"External","url":"http://localhost:5001/a2a","provider":{"organization":"Test"},"version":"1.0.0","capabilities":{"streaming":true}}')

          echo "Agent response: $AGENT_RESPONSE"

          # Extract agent ID from response
          AGENT_ID=$(echo "$AGENT_RESPONSE" | grep -o '"id":"[^"]*"' | head -1 | cut -d'"' -f4)

          if [ -z "$AGENT_ID" ]; then
            echo "⚠️ Failed to get agent ID"
            exit 1
          fi

          echo "Agent ID: $AGENT_ID"

          # Create delegation with the extracted agent ID
          RESPONSE=$(curl -s -X POST http://localhost:5000/a2a/delegations \
            -H "Content-Type: application/json" \
            -d "{\"agentId\":\"$AGENT_ID\",\"message\":{\"role\":\"user\",\"parts\":[{\"type\":\"text\",\"text\":\"Test\"}]}}")

          echo "Delegation response: $RESPONSE"

          # Check if delegation was created
          if echo "$RESPONSE" | grep -q "success"; then
            echo "✅ Delegation test passed"
          else
            echo "⚠️ Delegation test - external agent may not be available"
          fi

      - name: Cleanup
        if: always()
        run: |
          kill $MAIN_PID 2>/dev/null || true
          kill $EXT_PID 2>/dev/null || true

  load-tests:
    name: Load Tests
    runs-on: ubuntu-latest
    needs: delegation-tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: |
          cd packages/opencode
          bun install

      - name: Start server
        run: |
          cd packages/opencode
          bun run --conditions=browser ./src/index.ts serve --hostname 0.0.0.0 --port 5000 &
          SERVER_PID=$!
          echo "SERVER_PID=$SERVER_PID" >> $GITHUB_ENV
          sleep 10

      - name: Run load test
        run: |
          # Simple load test - create multiple delegations
          for i in {1..5}; do
            curl -s -X POST http://localhost:5000/a2a/agents \
              -H "Content-Type: application/json" \
              -d "{\"name\":\"Load Test Agent $i\",\"url\":\"http://localhost:5001/a2a\",\"provider\":{\"organization\":\"Test\"},\"version\":\"1.0.0\",\"capabilities\":{\"streaming\":true}}"
          done

          echo "Load test completed"

      - name: Cleanup
        if: always()
        run: kill $SERVER_PID 2>/dev/null || true
