version: "3.8"

services:
  ag-ui-chat:
    build:
      context: ../../
      dockerfile: deploy/ag-ui-chat/Dockerfile
    container_name: ag-ui-chat
    ports:
      - "80:80"
    environment:
      - WS_URL=ws://backend:5000/ag-ui/ws
      - SESSION_ID=${SESSION_ID:-test-session}
      - AUTH_TOKEN=${AUTH_TOKEN:-dev-token-12345}
      - SERVER_NAME=${SERVER_NAME:-localhost}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    networks:
      - ag-ui-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    image: opencode-server:latest
    container_name: ag-ui-backend
    ports:
      - "5000:5000"
    environment:
      - HOST=0.0.0.0
      - PORT=5000
    restart: unless-stopped
    networks:
      - ag-ui-network

networks:
  ag-ui-network:
    driver: bridge
