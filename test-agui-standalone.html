<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AG-UI Chat - Standalone</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #f5f5f5;
        height: 100vh;
        display: flex;
        flex-direction: column;
      }

      .header {
        background: white;
        padding: 16px;
        border-bottom: 1px solid #e0e0e0;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .header h1 {
        font-size: 18px;
        font-weight: 600;
        color: #333;
      }

      .connection-status {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 14px;
        color: #666;
      }

      .status-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #ccc;
      }

      .status-dot.connected {
        background: #4caf50;
      }

      .status-dot.connecting {
        background: #ff9800;
      }

      .status-dot.disconnected {
        background: #f44336;
      }

      .chat-container {
        flex: 1;
        overflow-y: auto;
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .message {
        max-width: 80%;
        padding: 12px 16px;
        border-radius: 12px;
        font-size: 14px;
        line-height: 1.5;
      }

      .message.user {
        align-self: flex-end;
        background: #2196f3;
        color: white;
        border-bottom-right-radius: 4px;
      }

      .message.agent {
        align-self: flex-start;
        background: white;
        color: #333;
        border: 1px solid #e0e0e0;
        border-bottom-left-radius: 4px;
      }

      .message-content {
        white-space: pre-wrap;
      }

      .timestamp {
        font-size: 11px;
        opacity: 0.7;
        margin-top: 4px;
      }

      .input-area {
        background: white;
        padding: 16px;
        border-top: 1px solid #e0e0e0;
      }

      .input-row {
        display: flex;
        gap: 12px;
      }

      .input-row input {
        flex: 1;
        padding: 12px 16px;
        border: 1px solid #ddd;
        border-radius: 8px;
        font-size: 14px;
        outline: none;
        transition: border-color 0.2s;
      }

      .input-row input:focus {
        border-color: #2196f3;
      }

      .input-row input:disabled {
        background: #f5f5f5;
        cursor: not-allowed;
      }

      .input-row button {
        padding: 12px 24px;
        background: #2196f3;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
        transition: background-color 0.2s;
      }

      .input-row button:hover:not(:disabled) {
        background: #1976d2;
      }

      .input-row button:disabled {
        background: #ccc;
        cursor: not-allowed;
      }

      .typing-indicator {
        display: none;
        padding: 12px 16px;
        background: white;
        border: 1px solid #e0e0e0;
        border-radius: 12px;
        align-self: flex-start;
        font-size: 14px;
        color: #666;
      }

      .typing-indicator.visible {
        display: block;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <h1>AG-UI Chat</h1>
      <div class="connection-status">
        <div class="status-dot disconnected" id="statusDot"></div>
        <span id="statusText">Disconnected</span>
      </div>
    </div>

    <div class="chat-container" id="chatContainer">
      <div class="message agent">
        <div class="message-content">Welcome to AG-UI Chat! Start a conversation with the AI agent.</div>
        <div class="timestamp" id="welcomeTimestamp"></div>
      </div>
    </div>

    <div class="typing-indicator" id="typingIndicator">Agent is typing...</div>

    <div class="input-area">
      <div class="input-row">
        <input type="text" id="messageInput" placeholder="Type your message..." disabled />
        <button id="sendButton" disabled>Send</button>
      </div>
    </div>

    <script>
      const sessionId = "test-session"
      const wsUrl = "ws://127.0.0.1:5000/ag-ui/ws"

      const chatContainer = document.getElementById("chatContainer")
      const messageInput = document.getElementById("messageInput")
      const sendButton = document.getElementById("sendButton")
      const statusDot = document.getElementById("statusDot")
      const statusText = document.getElementById("statusText")
      const typingIndicator = document.getElementById("typingIndicator")
      const welcomeTimestamp = document.getElementById("welcomeTimestamp")

      welcomeTimestamp.textContent = new Date().toLocaleTimeString()

      let ws = null
      let reconnectAttempts = 0
      const maxReconnectAttempts = 5
      const baseReconnectDelay = 1000

      function updateConnectionStatus(status) {
        statusDot.className = "status-dot " + status
        switch (status) {
          case "connected":
            statusText.textContent = "Connected"
            messageInput.disabled = false
            sendButton.disabled = false
            break
          case "connecting":
            statusText.textContent = "Connecting..."
            messageInput.disabled = true
            sendButton.disabled = true
            break
          case "disconnected":
            statusText.textContent = "Disconnected"
            messageInput.disabled = true
            sendButton.disabled = true
            break
          case "reconnecting":
            statusText.textContent = "Reconnecting..."
            messageInput.disabled = true
            sendButton.disabled = true
            break
        }
      }

      function addMessage(content, sender) {
        const messageDiv = document.createElement("div")
        messageDiv.className = "message " + sender
        messageDiv.innerHTML = `
        <div class="message-content">${escapeHtml(content)}</div>
        <div class="timestamp">${new Date().toLocaleTimeString()}</div>
      `
        chatContainer.appendChild(messageDiv)
        chatContainer.scrollTop = chatContainer.scrollHeight
      }

      function escapeHtml(text) {
        const div = document.createElement("div")
        div.textContent = text
        return div.innerHTML
      }

      function connect() {
        updateConnectionStatus("connecting")

        try {
          ws = new WebSocket(wsUrl)

          ws.onopen = function () {
            console.log("[AG-UI] WebSocket connected")
            updateConnectionStatus("connected")
            reconnectAttempts = 0

            // Send authentication
            const authMessage = {
              jsonrpc: "2.0",
              id: 1,
              method: "authenticate",
              params: {
                sessionId: sessionId,
                token: "dev-token-123",
              },
            }
            ws.send(JSON.stringify(authMessage))
          }

          ws.onmessage = function (event) {
            console.log("[AG-UI] Received:", event.data)

            try {
              const data = JSON.parse(event.data)

              if (data.result && data.result.authenticated) {
                console.log("[AG-UI] Authentication successful")
              } else if (data.type === "agent.message") {
                typingIndicator.classList.remove("visible")
                addMessage(data.data?.content || data.content, "agent")
              } else if (data.type === "agent.thinking") {
                typingIndicator.classList.add("visible")
              } else if (data.type === "agent.error") {
                typingIndicator.classList.remove("visible")
                addMessage("Error: " + (data.data?.error || "Unknown error"), "agent")
              }
            } catch (e) {
              console.error("[AG-UI] Error parsing message:", e)
            }
          }

          ws.onclose = function (event) {
            console.log("[AG-UI] WebSocket closed:", event.code, event.reason)
            updateConnectionStatus("disconnected")

            if (event.code !== 1000 && event.code !== 1008) {
              scheduleReconnect()
            }
          }

          ws.onerror = function (error) {
            console.error("[AG-UI] WebSocket error:", error)
            updateConnectionStatus("disconnected")
          }
        } catch (e) {
          console.error("[AG-UI] Failed to connect:", e)
          updateConnectionStatus("disconnected")
          scheduleReconnect()
        }
      }

      function getReconnectDelay(attempt) {
        const delay = baseReconnectDelay * Math.pow(2, attempt)
        return Math.min(delay, 30000)
      }

      function scheduleReconnect() {
        if (reconnectAttempts >= maxReconnectAttempts) {
          console.log("[AG-UI] Max reconnection attempts reached")
          updateConnectionStatus("disconnected")
          return
        }

        updateConnectionStatus("reconnecting")
        const delay = getReconnectDelay(reconnectAttempts)

        console.log(`[AG-UI] Reconnecting in ${delay}ms (attempt ${reconnectAttempts + 1}/${maxReconnectAttempts})`)

        setTimeout(() => {
          reconnectAttempts++
          connect()
        }, delay)
      }

      function sendMessage() {
        const content = messageInput.value.trim()
        if (!content || !ws || ws.readyState !== WebSocket.OPEN) {
          return
        }

        addMessage(content, "user")
        messageInput.value = ""

        const messageData = {
          jsonrpc: "2.0",
          id: Date.now(),
          method: "agent.message",
          params: {
            content: content,
            sessionId: sessionId,
          },
        }

        ws.send(JSON.stringify(messageData))
      }

      messageInput.addEventListener("keypress", function (e) {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault()
          sendMessage()
        }
      })

      sendButton.addEventListener("click", sendMessage)

      // Start connection
      connect()

      console.log("[AG-UI] Standalone chat initialized")
    </script>
  </body>
</html>
